__fader_buttons:
  includes: [fb_1, fb_2, fb_3, fb_4, fb_5, fb_6, fb_7, fb_8]
  type: ring_track
  ring_index: ${me.index}
  gestures:
    press: >
      "${me.track}" / SEL
    long_press: >
      ALL / ARM OFF ;
      "${me.track}" / ARM
    long_press__shift: >
      "${me.track}" / ARM
    double_click: >
      "${me.track}" / PLAY >

